services:
  english-bot:
    build: .
    image: english-bot:latest
    container_name: english-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist the SQLite database (created at /data/subscribers.db) across
      # container restarts and image rebuilds.
      - bot-data:/data
    # The bot makes only outbound HTTPS calls (Telegram long-poll + AI
    # providers). Port 8090 is reachable only within the Docker network (nginx).

  nginx:
    image: nginx:alpine
    container_name: english-bot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - english-bot

volumes:
  bot-data:
