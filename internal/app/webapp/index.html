<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover exposes the safe-area insets; we keep user scaling enabled
     for accessibility (the WIG flags user-scalable=no / maximum-scale). -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17212b" media="(prefers-color-scheme: dark)">
<title>English Bot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Each .view is one tab screen; the active one is shown by app.js. -->
<main id="main">
  <section class="view" id="view-profile">
    <div class="loading">Loading…</div>
  </section>

  <section class="view" id="view-vocab" hidden>
    <h1>📘 Library</h1>
    <input id="vocab-search" class="search" type="search" placeholder="Search words or meanings…" autocomplete="off">
    <div class="chips">
      <button class="chip chip-on" data-filter="all">Words</button>
      <button class="chip" data-filter="bookmarks">⭐ Bookmarks</button>
      <button class="chip" data-filter="idiom">💬 Idioms</button>
      <button class="chip" data-filter="collocation">🔗 Collocations</button>
      <button class="chip" data-filter="story">📖 Stories</button>
      <button class="chip" data-filter="tip">💡 Tips</button>
      <button class="chip" data-filter="quiz">🧩 Quizzes</button>
      <button class="chip" data-filter="dict">📖 Dict</button>
    </div>
    <div id="vocab-list" class="list"></div>
    <button id="vocab-more" class="more" hidden>Load more</button>
    <p id="vocab-empty" class="empty" hidden></p>
    <div id="dict-view" hidden>
      <input id="dict-search" class="search" type="search" placeholder="Search English → Persian…" autocomplete="off">
      <div id="dict-status" class="sub" hidden></div>
      <div id="dict-list" class="list"></div>
      <p id="dict-empty" class="empty" hidden>Type an English word to see its Persian meaning.</p>
    </div>
  </section>

  <section class="view" id="view-board" hidden>
    <div id="board-home">
      <h1>🏆 Leaderboard</h1>
      <div class="chips">
        <button class="chip chip-on" data-metric="words">All-time</button>
        <button class="chip" data-metric="weekly">📅 This week</button>
        <button class="chip" data-metric="today">☀️ Today</button>
        <button class="chip" data-metric="mastered">Mastered</button>
      </div>
      <div id="board-me" class="card" hidden></div>
      <div id="board-list" class="list"></div>
      <p id="board-empty" class="empty" hidden></p>
    </div>
    <!-- Profile drill-down (opened by tapping a row; BackButton returns). -->
    <div id="board-profile" hidden>
      <div id="profile-body"></div>
    </div>
  </section>

  <section class="view" id="view-review" hidden>
    <h1>🧠 Review</h1>
    <div id="review-swipe"></div>
  </section>

  <section class="view" id="view-decks" hidden>
    <div id="decks-home">
      <h1>📚 Study</h1>
      <div class="card">
        <h2>Practice now</h2>
        <div class="chips" style="margin:10px 0 0">
          <button class="chip" data-practice="quiz">🧩 Quiz</button>
          <button class="chip" data-practice="word">📘 New word</button>
          <button class="chip" data-practice="idiom">💬 Idiom</button>
          <button class="chip" data-practice="collocation">🔗 Collocation</button>
          <button class="chip" data-practice="story">📖 Story</button>
          <button class="chip" data-practice="tip">💡 Tip</button>
        </div>
      </div>
      <div class="card grammar-cta" id="grammar-open">
        <h2>Grammar lessons</h2>
        <div class="sub">📖 Learn one pattern at a time, from easy to advanced — with examples and quick practice.</div>
      </div>
      <div id="decks-list" class="list"></div>
      <p id="decks-empty" class="empty" hidden></p>
    </div>
    <div id="decks-detail" hidden>
      <div id="detail-body"></div>
    </div>
    <div id="decks-study" hidden>
      <h1 id="decks-study-title"></h1>
      <div id="decks-swipe"></div>
    </div>
    <div id="decks-practice" hidden>
      <h1 id="practice-title"></h1>
      <div id="practice-body"></div>
    </div>
    <div id="decks-grammar" hidden>
      <!-- Heading is rendered by grammar-body (list shows "Grammar", a lesson shows its title). -->
      <div id="grammar-body"></div>
    </div>
  </section>

  <!-- Opened via Telegram's native Settings button (no bottom tab). -->
  <section class="view" id="view-settings" hidden>
    <h1>⚙️ Settings</h1>
    <div id="settings-body"><div class="loading">Loading…</div></div>
  </section>
</main>

<!-- Bottom tab bar. Tabs are added here as later phases land. -->
<nav id="tabbar">
  <button class="tab tab-on" data-view="profile"><span>📊</span>Profile</button>
  <button class="tab" data-view="vocab"><span>📘</span>Library</button>
  <button class="tab" data-view="decks"><span>📚</span>Study</button>
  <button class="tab" data-view="review"><span>🧠</span>Review</button>
  <button class="tab" data-view="board"><span>🏆</span>Ranks</button>
</nav>

<script src="app.js"></script>
</body>
</html>
