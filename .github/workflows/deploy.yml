name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag, branch, or commit to deploy (e.g. v1.10.0, master, abc1234)'
        required: true
        default: 'master'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./... -count=1 -race

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e

            if [ ! -d ~/english-bot ]; then
              git clone https://github.com/${{ github.repository }}.git ~/english-bot
            fi

            cd ~/english-bot
            git fetch --all --tags
            git checkout ${{ github.event.inputs.ref }}

            docker compose down
            docker compose build --no-cache
            docker compose up -d

            docker image prune -f

            echo "Deployed ${{ github.event.inputs.ref }} successfully"
