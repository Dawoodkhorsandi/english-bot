name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (e.g. v1.10.0, latest)'
        required: true
        default: 'latest'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.event.inputs.tag }}
    steps:
      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          IMAGE: ${{ env.IMAGE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: ENV_FILE,IMAGE
          script: |
            set -e

            mkdir -p ~/english-bot && cd ~/english-bot

            # Write .env from GitHub secret
            echo "$ENV_FILE" > .env

            # Write docker-compose.yml pointing to the registry image
            cat > docker-compose.yml <<EOF
            services:
              english-bot:
                image: $IMAGE
                container_name: english-bot
                restart: unless-stopped
                env_file:
                  - .env
                volumes:
                  - bot-data:/data

            volumes:
              bot-data:
            EOF

            docker compose pull
            docker compose up -d

            docker image prune -f

            echo "Deployed $IMAGE successfully"
