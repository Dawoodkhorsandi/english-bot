name: Deploy

on:
  # Manual trigger — deploy any tag on demand.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (e.g. v1.10.0, latest)'
        required: true
        default: 'latest'
  # Reusable trigger — called by release.yml to auto-deploy a version tag.
  workflow_call:
    inputs:
      tag:
        description: 'Image tag to deploy'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
    steps:
      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          IMAGE: ${{ env.IMAGE }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: ENV_FILE,IMAGE,GHCR_TOKEN
          script: |
            set -e

            mkdir -p ~/english-bot && cd ~/english-bot

            # Authenticate with GitHub Container Registry
            echo "$GHCR_TOKEN" | docker login ghcr.io -u github --password-stdin

            # Write .env from GitHub secret
            echo "$ENV_FILE" > .env

            # Write nginx reverse-proxy config. Quoted heredoc ('NGINX') so the
            # shell does NOT expand nginx's own $host/$remote_addr/etc variables.
            cat > nginx.conf <<'NGINX'
            server {
                listen 80;
                server_name bot.mardeen.ir;

                location / {
                    proxy_pass         http://english-bot:8090;
                    proxy_http_version 1.1;
                    proxy_set_header   Host              $host;
                    proxy_set_header   X-Real-IP         $remote_addr;
                    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
                    proxy_set_header   X-Forwarded-Proto $scheme;
                    proxy_read_timeout 30s;
                }
            }

            server {
                listen 80;
                server_name catan.mardeen.ir;

                location / {
                    proxy_pass         http://catan-server:8080;
                    proxy_http_version 1.1;
                    proxy_set_header   Upgrade           $http_upgrade;
                    proxy_set_header   Connection        "upgrade";
                    proxy_set_header   Host              $host;
                    proxy_set_header   X-Real-IP         $remote_addr;
                    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
                    proxy_set_header   X-Forwarded-Proto $scheme;
                    proxy_read_timeout 3600s;
                    proxy_send_timeout 3600s;
                }
            }
            NGINX

            # Write docker-compose.yml pointing to the registry image. nginx
            # publishes :80 on the host and proxies to english-bot:8090 over the
            # compose network — the external HTTPS proxy forwards to this :80.
            cat > docker-compose.yml <<EOF
            services:
              english-bot:
                image: $IMAGE
                container_name: english-bot
                restart: unless-stopped
                env_file:
                  - .env
                volumes:
                  - bot-data:/data

              nginx:
                image: nginx:alpine
                container_name: english-bot-nginx
                restart: unless-stopped
                ports:
                  - "80:80"
                volumes:
                  - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
                networks:
                  - default
                  - web
                depends_on:
                  - english-bot

            networks:
              web:
                external: true

            volumes:
              bot-data:
            EOF

            docker network create web 2>/dev/null || true
            docker compose pull
            # --force-recreate so changes to .env (env_file) are picked up even
            # when the image tag is unchanged; without it, compose reports the
            # container "up-to-date" and keeps running with the old environment.
            docker compose up -d --force-recreate

            docker image prune -f

            echo "Deployed $IMAGE successfully"
