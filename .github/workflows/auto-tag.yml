name: Auto Tag

# Bridges the app version to git tags: on every push to master, read the newest
# entry in the Changelogs slice in main.go and, if no matching vX.Y.Z tag exists,
# create and push it. Pushing the tag (with a PAT, not GITHUB_TOKEN) triggers
# release.yml, which builds, releases, and deploys that version.

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history + tags to check for an existing tag
          # Persist the PAT (not the default GITHUB_TOKEN) as the git credential so
          # the tag push below is authored by the PAT and therefore triggers
          # release.yml. A GITHUB_TOKEN-authored push does not trigger workflows.
          token: ${{ secrets.GHCR_TOKEN }}

      - name: Determine version from changelog
        id: ver
        run: |
          # Newest changelog entry is the last `Version: "X.Y.Z"` in the slice.
          VERSION=$(grep -oP 'Version:\s*"\K[0-9]+\.[0-9]+\.[0-9]+' internal/app/changelog.go | tail -1)
          if [ -z "$VERSION" ]; then
            echo "::error::No Changelogs version found in internal/app/changelog.go"
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Newest changelog version: v$VERSION"

      - name: Create and push tag if missing
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          # Uses the PAT credential persisted by checkout above, so this push
          # triggers release.yml (build + GitHub Release + deploy to the VPS).
          git push origin "$TAG"
          echo "Pushed $TAG — release + deploy will follow."
